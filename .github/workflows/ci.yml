# Runs the unit tests and a debug build on every pull request and on pushes to main.
name: CI

on:
  pull_request:
    paths: ["app/**", "*.gradle.kts", "gradle/**", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["app/**", "*.gradle.kts", "gradle/**", ".github/workflows/ci.yml"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
