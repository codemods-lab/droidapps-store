# Builds a signed release APK when you push a tag like v1.2.3, publishes it to the public
# APK repo (codemods-lab/utildroid-apps) as release "<app-id>-v1.2.3", then pings
# utildroid-store so the catalog picks it up. The app's own repo can stay private.
#
# Copy to .github/workflows/release.yml in each app repo.
# Repo secrets needed: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD, UTILDROID_TOKEN
#   UTILDROID_TOKEN: fine-grained token with Contents: read and write on
#   codemods-lab/utildroid-apps and codemods-lab/utildroid-store.
# APP_ID must match the app's `id` in utildroid-store/catalog/apps.yaml (defaults to the repo name).
name: Release APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  APP_ID: ${{ vars.APP_ID || github.event.repository.name }}
  RELEASES_REPO: codemods-lab/utildroid-apps
  STORE_REPO: codemods-lab/utildroid-store

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag (v1.2.3 -> name 1.2.3, code 10203)
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          IFS=. read -r MA MI PA <<< "$NAME"
          PA="${PA%%[!0-9]*}"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))" >> "$GITHUB_ENV"

      - name: Decode signing key
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "${APP_ID}-${VERSION_NAME}.apk"

      - name: Release notes from commits since the previous tag
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..$GITHUB_REF_NAME"; else RANGE="$GITHUB_REF_NAME"; fi
          git log --no-merges --pretty='- %s' "$RANGE" > notes.md
          [ -s notes.md ] || echo "- Release $VERSION_NAME" > notes.md

      - name: Publish to the public APK repo
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.UTILDROID_TOKEN }}
          tag_name: ${{ env.APP_ID }}-${{ github.ref_name }}
          name: ${{ env.APP_ID }} ${{ env.VERSION_NAME }}
          files: "*.apk"
          body_path: notes.md

      - name: Tell UtilDroid Store to rebuild its catalog
        env:
          GH_TOKEN: ${{ secrets.UTILDROID_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$STORE_REPO/dispatches" \
            -d '{"event_type":"app-released"}'
